<div class="cocinero-container">
  <h1>📋 Pedidos en Cocina</h1>

  <div *ngIf="cargando" class="loading">Cargando pedidos...</div>
  <div *ngIf="!cargando && pedidos.length === 0" class="no-pedidos">
    No hay pedidos pendientes.
  </div>

  <div class="pedidos-grid" *ngIf="pedidos.length > 0">
    <div
      class="pedido-card"
      *ngFor="let pedido of pedidos"
      [ngClass]="{ animando: pedido.animando }"
      [style.borderColor]="getColorPorEstado(pedido.estado)"
    >
      <div class="pedido-header">
        <h2>Pedido mesa {{ displayMesa(pedido) }}</h2>
        <span
          class="estado"
          [ngStyle]="{ 'background-color': getColorPorEstado(pedido.estado) }"
        >
          {{ pedido.estado | uppercase }}
        </span>
      </div>

      <p class="fecha">🕒 {{ pedido.fecha || pedido.creadoEn | date: 'short' }}</p>

      <table class="detalle">
        <colgroup>
          <col style="width: 60%" />
          <col style="width: 12%" />
          <col style="width: 28%" />
        </colgroup>

        <thead>
          <tr>
            <th class="col-plato">Plato</th>
            <th class="col-cant">Cant.</th>
            <th class="col-obs">Observaciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let det of lineas(pedido)">
            <td class="col-plato">{{ det.plato }}</td>
            <td class="col-cant">{{ det.cantidad }}</td>
            <td class="col-obs">{{ det.comentarios || '—' }}</td>
          </tr>
        </tbody>
      </table>

      <div class="acciones">
        <button class="btn azul" (click)="cambiarEstado(pedido, 'en_proceso')">
  👨‍🍳 En preparación
</button>

        <button class="btn verde" (click)="cambiarEstado(pedido, 'listo')">
          ✅ Listo
        </button>
      </div>
    </div>
  </div>
</div>
