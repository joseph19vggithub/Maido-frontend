<section class="reserva-container">
  <div class="reserva-card">
    <h1 class="reserva-title">Reserva tu experiencia Maido</h1>
    <p class="reserva-subtitle">
      Completa los pasos para asegurar tu mesa y vivir la experiencia Nikkei.
    </p>

    <!-- Usa (submit) y quita (click) del botón -->
    <form class="reserva-form" novalidate (submit)="confirmarReserva($event)">
      <!-- 🧍 Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ej. Javier Cruz" required />
        <p class="error-msg" *ngIf="errores['nombre']">{{ errores['nombre'] }}</p>
      </div>

      <!-- 📧 Email -->
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="Ej. javier@mail.com" required />
        <p class="error-msg" *ngIf="errores['email']">{{ errores['email'] }}</p>
      </div>

      <!-- 📞 Teléfono -->
      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" placeholder="Ej. 987654321" required />
        <p class="error-msg" *ngIf="errores['telefono']">{{ errores['telefono'] }}</p>
      </div>

      <!-- 🆔 DNI -->
      <div class="form-group">
        <label for="dni">DNI</label>
        <input type="text" id="dni" placeholder="Ej. 12345678" maxlength="8" required />
        <p class="error-msg" *ngIf="errores['dni']">{{ errores['dni'] }}</p>
      </div>

      <!-- 👥 Personas / 📅 Fecha / ⏰ Hora -->
      <div class="form-row">
        <div class="form-group">
          <label for="personas">Número de personas</label>
          <input type="number" id="personas" min="1" max="10" placeholder="Entre 1 y 10" required />
          <p class="error-msg" *ngIf="errores['personas']">{{ errores['personas'] }}</p>
        </div>

        <div class="form-group">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" required />
          <p class="error-msg" *ngIf="errores['fecha']">{{ errores['fecha'] }}</p>
        </div>

        <div class="form-group">
          <label for="hora">Hora (1 pm - 9 pm)</label>
          <input type="time" id="hora" min="13:00" max="21:00" step="1800" required />
          <p class="error-msg" *ngIf="errores['hora']">{{ errores['hora'] }}</p>
        </div>
      </div>

      <!-- 💬 Comentarios -->
      <div class="form-group">
        <label for="mensaje">Comentarios</label>
        <textarea id="mensaje" rows="3" placeholder="Ej.alergias o indicaciones especiales"></textarea>
      </div>

      <!-- 🔘 Botón de envío -->
      <button class="btn-reserva" type="submit">Confirmar reserva</button>
    </form>
  </div>
</section>
