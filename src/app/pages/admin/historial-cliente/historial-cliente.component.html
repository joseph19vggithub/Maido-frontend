<div class="page">
  <!-- HEADER PRINCIPAL -->
  <header class="header">
    <h1>Historial de clientes</h1>

    <div class="header-right">
      <!-- BÚSQUEDA -->
      <input
        class="search"
        type="text"
        placeholder="Buscar por observación, reserva o cliente..."
        [(ngModel)]="q"
        aria-label="Buscar en el historial de clientes" />

      <!-- BOTONES DE FILTRO -->
      <button
        type="button"
        class="pill ghost"
        [class.active]="filtroFecha === 'hoy'"
        (click)="setFiltroFecha('hoy')">
        Hoy
      </button>

      <button
        type="button"
        class="pill ghost"
        [class.active]="filtroFecha === 'ayer'"
        (click)="setFiltroFecha('ayer')">
        Ayer
      </button>

      <button
        type="button"
        class="pill ghost"
        [class.active]="filtroFecha === 'semana'"
        (click)="setFiltroFecha('semana')">
        Esta semana
      </button>

      <!-- Calendario -->
      <input
        type="date"
        class="pill"
        [(ngModel)]="fechaSeleccionada"
        (change)="onFechaChange()"
        aria-label="Filtrar por fecha específica" />
    </div>
  </header>

  <!-- ERROR -->
  <section *ngIf="error" class="alert error">
    {{ error }}
  </section>

  <!-- LAYOUT PRINCIPAL -->
  <section class="layout">
    <!-- LISTA -->
    <div class="panel list-panel">
      <div class="panel-header">
        <h2>Registros</h2>
        <span *ngIf="cargando" class="badge">Cargando…</span>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Fecha registro</th>
              <th class="col-observaciones">Observaciones</th>
              <th>Cliente</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let h of listaFiltrada">
              <td>{{ h.id }}</td>
              <td>{{ h.fechaVisita | date:'yyyy-MM-dd' }}</td>
              <td class="col-observaciones">{{ h.observaciones || '-' }}</td>
              <td>{{ getNombreReserva(h) }}</td>

              <td class="col-actions">
                <button
                  type="button"
                  class="btn small"
                  (click)="editar(h)">
                  Editar
                </button>

                <button
                  type="button"
                  class="btn small danger"
                  (click)="eliminar(h)">
                  Eliminar
                </button>
              </td>
            </tr>

            <tr *ngIf="!cargando && listaFiltrada.length === 0">
              <td colspan="5" class="empty">
                No hay registros para mostrar.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- FORMULARIO LATERAL -->
    <div class="panel form-panel">
      <div class="panel-header">
        <h2>{{ editId ? 'Editar historial' : 'Nuevo historial' }}</h2>
      </div>

      <form #f="ngForm" (ngSubmit)="guardarHistorial()">
        <!-- FECHA -->
        <div class="form-group">
          <label for="fechaVisita">Fecha de registro</label>
          <input
            id="fechaVisita"
            name="fechaVisita"
            type="date"
            [(ngModel)]="form.fechaVisita"
            required />
        </div>

        <!-- RESERVA / CLIENTE -->
        <div class="form-group">
          <label for="idReserva">Cliente</label>
          <select
            id="idReserva"
            name="idReserva"
            [(ngModel)]="form.idReserva"
            required>
            <option value="">-- Selecciona una reserva --</option>
            <option *ngFor="let r of reservas" [value]="r.id">
              {{ r.nombreCompleto }}
            </option>
          </select>
        </div>

        <!-- OBSERVACIONES -->
        <div class="form-group">
          <label for="observaciones">Observaciones</label>
          <textarea
            id="observaciones"
            name="observaciones"
            rows="4"
            [(ngModel)]="form.observaciones"
            placeholder="Comentarios sobre la visita (ej: sin picante, alergias, preferencias)">
          </textarea>
        </div>

        <!-- BOTONES -->
        <div class="form-actions">
          <button
            type="submit"
            class="btn primary"
            [disabled]="f.invalid || cargando">
            {{ editId ? 'Actualizar' : 'Registrar' }}
          </button>

          <button
            type="button"
            class="btn ghost"
            (click)="limpiarForm()">
            Limpiar
          </button>

          <button
            *ngIf="editId"
            type="button"
            class="btn danger small"
            (click)="cancelarEdicion()">
            Cancelar edición
          </button>
        </div>
      </form>
    </div>
  </section>
</div>
