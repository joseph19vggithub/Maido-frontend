<!-- ===== Encabezado de página (fuera de la card) ===== -->
<header class="page-header">
  <h1 class="page-title">Pedidos</h1>
  <p class="page-subtitle">Gestión de los pedidos del restaurante</p>
</header>

<!-- ===== CARD PRINCIPAL ===== -->
<div class="card">
  <div class="card-header">
    <!-- grupo de chips -->
    <div class="chip-group">
      <button
        type="button"
        class="chip"
        [class.active]="filtro==='hoy'"
        (click)="setFiltro('hoy')">
        Hoy
      </button>

      <button
        type="button"
        class="chip"
        [class.active]="filtro==='ayer'"
        (click)="setFiltro('ayer')">
        Ayer
      </button>

      <button
        type="button"
        class="chip"
        [class.active]="filtro==='semana'"
        (click)="setFiltro('semana')">
        Esta semana
      </button>
    </div>

    <!-- fecha a la derecha -->
    <input
      type="date"
      #fecha
      [value]="fechaBase"
      (change)="onFechaChange(fecha.value)"
      class="date-input"
      aria-label="Filtrar pedidos por fecha específica"
    />
  </div>

  <div class="card-body p-0">
    <div *ngIf="error" class="p-3 text-danger">{{ error }}</div>

    <div class="table-responsive" *ngIf="!error">
      <table class="table table-darkish mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Reserva</th>
            <th>Total (S/)</th>
            <th class="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="cargando" class="state-row">
            <td colspan="6">Cargando...</td>
          </tr>

          <tr *ngIf="!cargando && view.length === 0" class="state-row">
            <td colspan="6" class="muted">Sin pedidos.</td>
          </tr>

          <tr *ngFor="let p of view">
            <td>{{ p.id }}</td>
            <td>{{ p.fecha | date:'yyyy-MM-dd' }}</td>
            <td>
              <span class="tag"
                    [class.pendiente]="p.estado==='pendiente'"
                    [class.en_proceso]="p.estado==='en_proceso'"
                    [class.listo]="p.estado==='listo'"
                    [class.entregado]="p.estado==='entregado'">
                {{ p.estado.replace('_',' ') }}
              </span>
            </td>
            <td>{{ p.idReserva }}</td>
            <td>{{ p.total | number:'1.2-2' }}</td>
            <td class="acciones-td">
              <button
                type="button"
                class="btn btn-xs"
                (click)="abrirModal(p)">
                Editar
              </button>

              <button
                type="button"
                class="btn btn-xs danger"
                (click)="eliminarPedido(p.id)">
                Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ========================= MODAL ========================= -->
<div class="backdrop" *ngIf="mostrarModal" (click)="onBackdrop($event)">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-head">
      <h5 class="title">Editar pedido #{{ pedidoSeleccionado?.id }}</h5>
      <button
        type="button"
        class="icon-close"
        (click)="cerrarModal()">
        ✕
      </button>
    </div>

    <form (submit)="guardarCambios(); $event.preventDefault()">
      <div class="grid">
        <label class="field">
          <span>Fecha</span>
          <input
            type="date"
            [(ngModel)]="fechaModal"
            name="fecha"
            required />
        </label>

        <label class="field">
          <span>Estado</span>
          <select
            [(ngModel)]="pedidoSeleccionado!.estado"
            name="estado"
            required>
            <option [ngValue]="'pendiente'">Pendiente</option>
            <option [ngValue]="'en_proceso'">En proceso</option>
            <option [ngValue]="'listo'">Listo</option>
            <option [ngValue]="'entregado'">Entregado</option>
          </select>
        </label>

        <label class="field">
          <span>Id Reserva</span>
          <input
            type="number"
            [(ngModel)]="pedidoSeleccionado!.idReserva"
            name="idReserva"
            required />
        </label>

        <label class="field">
          <span>Total (S/)</span>
          <input
            type="number"
            step="0.01"
            [(ngModel)]="pedidoSeleccionado!.total"
            name="total"
            required />
        </label>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Guardar</button>
        <button
          type="button"
          class="btn ghost"
          (click)="cerrarModal()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
