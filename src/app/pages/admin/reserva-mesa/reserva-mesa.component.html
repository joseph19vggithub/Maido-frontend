<div class="card" style="margin:12px;">
  <form [formGroup]="form" class="form" (submit)="$event.preventDefault()">
    <input type="number" formControlName="id" hidden readonly />

    <div class="row g-2 align-items-end">
      <div class="col-md-4">
        <label class="form-label">IdReserva</label>
        <input
          type="number"
          class="form-control"
          formControlName="idReserva"
          placeholder="IdReserva" />
      </div>

      <div class="col-md-4">
        <label class="form-label">IdMesa</label>
        <input
          type="number"
          class="form-control"
          formControlName="idMesa"
          placeholder="IdMesa" />
      </div>

      <div class="col-md-4 d-flex gap-2">
        <button
          type="button"
          class="btn btn-primary"
          (click)="registrar()"
          [disabled]="form.invalid || isEditing">
          Registrar
        </button>

        <button
          type="button"
          class="btn btn-success"
          (click)="actualizar()"
          [disabled]="form.invalid || !isEditing">
          Actualizar
        </button>

        <button
          type="button"
          class="btn btn-danger"
          (click)="eliminar()"
          [disabled]="!isEditing">
          Eliminar
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          (click)="limpiar()">
          Limpiar
        </button>
      </div>
    </div>
  </form>
</div>

<div class="card" style="margin:12px;">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Reserva</th>
          <th>Mesa</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let r of reservaMesas"
          (click)="seleccionar(r)"
          style="cursor:pointer;">
          <td>{{ r.id }}</td>

          <!-- 👇 igual que usuario-rol: usa la relación si viene, sino el ID -->
          <td>{{ r.reserva?.nombreCompleto || r.idReserva }}</td>
          <td>{{ r.mesa?.numero || r.idMesa }}</td>
        </tr>

        <tr *ngIf="reservaMesas.length === 0">
          <td colspan="3" class="text-center">Sin registros.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
