<!-- ===== Encabezado de página ===== -->
<header class="page-header">
  <h1 class="page-title">Categorías</h1>
  <p class="page-subtitle">
    Gestión de las categorías de experiencias
  </p>
</header>

<!-- ===== LISTADO ===== -->
<div class="card">
  <div class="card-header">
    <h3 class="card-title">Listado</h3>

    <div class="card-header-actions">
      <div *ngIf="error" class="error-text">
        {{ error }}
      </div>

      <button type="button" class="btn" (click)="limpiar()">
        Nueva
      </button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th class="col-descripcion">Descripción</th>
        <th class="col-actions">Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngIf="cargando" class="message-row">
        <td colspan="3" class="message-cell">Cargando…</td>
      </tr>

      <tr *ngIf="!cargando && data.length === 0" class="message-row">
        <td colspan="3" class="message-cell">Sin datos.</td>
      </tr>

      <tr *ngFor="let x of data">
        <td>{{ x.nombre }}</td>
        <td class="col-descripcion">{{ x.descripcion || '' }}</td>
        <td class="col-actions">
          <button
            type="button"
            class="btn sm"
            (click)="editar(x)">
            Editar
          </button>

          <button
            type="button"
            class="btn sm danger"
            (click)="eliminar(x)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- ===== FORMULARIO ===== -->
<div class="card">
  <div class="card-header">
    <h3 class="card-title">
      {{ f.id ? 'Editar categoría' : 'Nueva categoría' }}
    </h3>
  </div>

  <div class="grid">
    <label>
      Nombre
      <input
        type="text"
        [(ngModel)]="f.nombre"
        placeholder="Nombre de la categoría" />
    </label>

    <label style="grid-column:1/-1">
      Descripción
      <textarea
        rows="3"
        [(ngModel)]="f.descripcion"
        placeholder="Descripción (opcional)">
      </textarea>
    </label>
  </div>

  <div class="form-actions">
    <button
      type="button"
      class="btn primary"
      (click)="guardar()">
      {{ f.id ? 'Actualizar' : 'Guardar' }}
    </button>

    <button
      type="button"
      class="btn"
      (click)="limpiar()">
      Cancelar
    </button>
  </div>
</div>
