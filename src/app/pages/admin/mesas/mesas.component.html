<div class="card">
  <h3 style="margin:0 0 10px">Mesas</h3>

  <div *ngIf="cargando">Cargando...</div>
  <div *ngIf="!cargando && error" style="color:#ef4444">{{ error }}</div>

  <table *ngIf="!cargando">
    <thead>
      <tr>
        <th>ID</th>
        <th>Número</th>
        <th>Capacidad</th>
        <th>Estado</th>
        <th>Ubicación</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>

    <tbody *ngIf="data.length; else sinDatos">
      <tr *ngFor="let m of data; trackBy: trackById">
        <td>{{ m.id }}</td>
        <td>{{ m.numero }}</td>
        <td>{{ m.capacidad }}</td>
        <td>
          <span [ngStyle]="{
            'color': m.estado==='Ocupada' ? '#ef4444' :
                     m.estado==='Reservada' ? '#eab308' :
                     m.estado==='Mantenimiento' ? '#94a3b8' :
                     '#22c55e',
            'font-weight': 600
          }">{{ m.estado }}</span>
        </td>
        <td>{{ m.ubicacion || '-' }}</td>
        <td class="text-end">
          <button class="btn-link" style="font-weight:700" (click)="editar(m)">Editar</button>
          <button class="btn-danger" (click)="eliminar(m)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #sinDatos>
    <tr><td colspan="6" style="color:#94a3b8;padding:8px 0">Sin datos.</td></tr>
  </ng-template>
</div>

<!-- Formulario -->
<div class="card" style="margin-top:16px">
  <div class="card-title" style="margin-bottom:8px">
    {{ modo === 'crear' ? 'Nueva mesa' : ('Editar mesa #' + (seleccionado?.numero ?? '')) }}
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    <div class="grid">
      <div class="col">
        <label>Número</label>
        <input type="number" formControlName="numero" min="1">
        <small *ngIf="f['numero'].touched && f['numero'].invalid" class="err">Requerido (>=1)</small>
      </div>

      <div class="col">
        <label>Capacidad</label>
        <input type="number" formControlName="capacidad" min="1">
        <small *ngIf="f['capacidad'].touched && f['capacidad'].invalid" class="err">Requerido (>=1)</small>
      </div>

      <div class="col">
        <label>Ubicación</label>
        <input type="text" formControlName="ubicacion" placeholder="Piso 1 / Terraza">
      </div>

      <div class="col">
        <label>Estado</label>
        <select formControlName="estado">
          <option *ngFor="let e of estados" [value]="e">{{ e }}</option>
        </select>
      </div>
    </div>

    <div style="margin-top:12px; display:flex; gap:8px">
      <button class="btn-success" type="submit" [disabled]="form.invalid">
        {{ modo === 'crear' ? 'Guardar' : 'Actualizar' }}
      </button>
      <button class="btn-outline" type="button" (click)="cancelarEdicion()" *ngIf="modo==='editar'">Cancelar</button>
    </div>
  </form>
</div>

<!-- estilos mínimos inline -->
<style>
  .card { background:#111827; color:#e5e7eb; padding:16px; border-radius:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:10px; border-bottom:1px solid #1f2937; }
  .text-end { text-align:right; }
  .btn-link { background:transparent; border:none; color:#60a5fa; cursor:pointer; }
  .btn-danger { background:#ef4444; color:#fff; border:none; border-radius:6px; padding:6px 10px; cursor:pointer; }
  .btn-success { background:#22c55e; color:#111827; border:none; border-radius:6px; padding:8px 12px; font-weight:700; }
  .btn-outline { background:transparent; border:1px solid #4b5563; color:#e5e7eb; border-radius:6px; padding:8px 12px; }
  input, select { width:100%; background:#0b1220; color:#e5e7eb; border:1px solid #334155; border-radius:8px; padding:8px; }
  .grid { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:12px; }
  .col label { display:block; margin-bottom:4px; color:#cbd5e1; font-size:13px; }
  .err { color:#f87171; }
  @media (max-width: 900px){ .grid { grid-template-columns: 1fr 1fr; } }
</style>
