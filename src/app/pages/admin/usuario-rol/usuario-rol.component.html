<!-- ===== Encabezado fuera de la card ===== -->
<header class="page-header">
  <h1 class="page-title">Usuario – Rol</h1>
  <p class="page-subtitle">
    Asigna roles a las cuentas del sistema.
  </p>
</header>

<!-- CARD FORMULARIO -->
<div class="card usuario-rol-card">
  <form [formGroup]="form" class="form" (submit)="$event.preventDefault()">
    <input type="number" formControlName="id" hidden readonly />

    <div class="row g-2 align-items-end form-row">
      <div class="col-md-4">
        <label class="form-label">IdUsuario</label>
        <input
          type="number"
          class="form-control"
          formControlName="idUsuario"
          placeholder="IdUsuario" />
      </div>

      <div class="col-md-4">
        <label class="form-label">IdRol</label>
        <input
          type="number"
          class="form-control"
          formControlName="idRol"
          placeholder="IdRol" />
      </div>

      <div class="col-md-4">
        <div class="form-actions">
          <button
            type="button"
            class="btn btn-primary"
            (click)="registrar()"
            [disabled]="form.invalid || isEditing">
            Registrar
          </button>

          <button
            type="button"
            class="btn btn-success"
            (click)="actualizar()"
            [disabled]="form.invalid || !isEditing">
            Actualizar
          </button>

          <button
            type="button"
            class="btn btn-danger"
            (click)="eliminar()"
            [disabled]="!isEditing">
            Eliminar
          </button>

          <button
            type="button"
            class="btn btn-secondary"
            (click)="limpiar()">
            Limpiar
          </button>
        </div>
      </div>
    </div>
  </form>
</div>

<!-- CARD TABLA -->
<div class="card usuario-rol-card">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th style="width:80px">ID</th>
          <th>Usuario</th>
          <th>Rol</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let r of usuarioRoles"
          (click)="seleccionar(r)"
          style="cursor:pointer;">
          <td>{{ r.id }}</td>
          <!-- muestra el nombre si viene la relación; si no, el ID -->
          <td>{{ r.usuario?.username || r.idUsuario }}</td>
          <td>{{ r.rol?.nombre || r.idRol }}</td>
        </tr>

        <tr *ngIf="usuarioRoles.length === 0">
          <td colspan="3" class="text-center">Sin registros.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
